name: toffeetwist
description: "Toffee Twist: Sweet Match 3 - an original cozy match-3 puzzle game."
publish_to: 'none'

# version: <name>+<build number>. Increase the build number (+2, +3, ...) for
# every upload to Google Play.
version: 1.0.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  flame_audio: ^2.12.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/levels/
    - assets/audio/
    - assets/fonts/Baloo2-OFL.txt
    - assets/fonts/Nunito-OFL.txt

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800

# App icon: `dart run flutter_launcher_icons` (images made by tool/branding/).
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "branding/icon_full.png"
  min_sdk_android: 24
  adaptive_icon_background: "branding/icon_background.png"
  adaptive_icon_foreground: "branding/icon_foreground.png"
  adaptive_icon_monochrome: "branding/icon_monochrome.png"
  # The foreground image already keeps the toffee inside the safe zone.
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: "branding/icon_full.png"
    background_color: "#F8C66E"
    theme_color: "#E8A23B"

# Splash screen: `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#FFE9C4"
  image: branding/splash.png
  android_12:
    image: branding/splash_android12.png
    color: "#FFE9C4"
  android_screen_orientation: portrait
  ios: false
  web: false
