# Builds the Android app on GitHub's computers, so you don't need Android Studio.
#
# It runs by itself after every push (and from the "Actions" tab >
# "Build Android app" > "Run workflow"). After about 15 minutes the files
# appear on the repository's "Releases" page under "Latest build":
#   toffee-twist.apk  - open this on your Android phone to install and play
#   toffee-twist.aab  - the bundle for Google Play
#
# Without the secrets below, both files are signed with a debug key. The APK
# still installs on a phone, but Google Play only accepts an .aab signed with
# YOUR upload key. To sign with it, add these in
# Settings > Secrets and variables > Actions > New repository secret:
#   UPLOAD_KEYSTORE_BASE64  - your .jks file as base64
#                             (macOS/Linux: base64 -w0 ~/toffee-twist-upload.jks)
#   UPLOAD_KEYSTORE_PASSWORD - the password you chose for the key
name: Build Android app

on:
  workflow_dispatch:
  push:
    paths-ignore: ['**.md', 'docs/**', 'store_assets/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Use the upload key (only if the secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No upload key secrets: signing with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=upload.jks
          EOF

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: toffee-twist-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Publish to the "Latest build" release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk toffee-twist.apk
          cp build/app/outputs/bundle/release/app-release.aab toffee-twist.aab
          if [ -f android/key.properties ]; then
            SIGNING="The .aab is signed with your upload key and can be uploaded to Google Play."
          else
            SIGNING="Signed with a debug key: the .apk installs on a phone, but Google Play will not accept this .aab (see the top of .github/workflows/build-android.yml)."
          fi
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build toffee-twist.apk toffee-twist.aab \
            --target "$GITHUB_SHA" --prerelease --title "Latest build" \
            --notes "Built automatically from commit $GITHUB_SHA. $SIGNING"
