# Builds the Android app on GitHub's computers, so you don't need Android Studio.
#
# It runs by itself after every push (and from the "Actions" tab >
# "Build Android app" > "Run workflow"). It also opens the game on an Android
# emulator to check that it starts. After about 25 minutes the files
# appear on the repository's "Releases" page under "Latest build":
#   toffee-twist.apk  - open this on your Android phone to install and play
#   toffee-twist.aab  - the bundle for Google Play
#
# Without the secrets below, both files are signed with a debug key. The APK
# still installs on a phone, but Google Play only accepts an .aab signed with
# YOUR upload key. To sign with it, add these in
# Settings > Secrets and variables > Actions > New repository secret:
#   UPLOAD_KEYSTORE_BASE64  - your .jks file as base64
#                             (macOS/Linux: base64 -w0 ~/toffee-twist-upload.jks)
#   UPLOAD_KEYSTORE_PASSWORD - the password you chose for the key
name: Build Android app

on:
  workflow_dispatch:
  push:
    paths-ignore: ['**.md', 'docs/**', 'store_assets/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Use the upload key (only if the secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No upload key secrets: signing with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=upload.jks
          EOF

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: toffee-twist-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  # Installs the APK on an Android emulator and checks that the game opens
  # without crashing. The crash log is printed in this job's output.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: toffee-twist-android
          path: artifact

      - name: Enable the emulator's hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the game on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke_test.sh artifact/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test
          path: |
            logcat.txt
            emulator-screenshot.png

  publish:
    needs: [build, emulator-test]
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: toffee-twist-android
          path: artifact

      - uses: actions/download-artifact@v4
        with:
          name: emulator-test
          path: emulator

      - name: Publish to the "Latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNED: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
        run: |
          cp artifact/flutter-apk/app-release.apk toffee-twist.apk
          cp artifact/bundle/release/app-release.aab toffee-twist.aab
          if [ "$SIGNED" = true ]; then
            SIGNING="The .aab is signed with your upload key and can be uploaded to Google Play."
          else
            SIGNING="Signed with a debug key: the .apk installs on a phone, but Google Play will not accept this .aab (see the top of .github/workflows/build-android.yml)."
          fi
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build toffee-twist.apk toffee-twist.aab emulator/emulator-screenshot.png \
            --target "$GITHUB_SHA" --prerelease --title "Latest build" \
            --notes "Built automatically from commit $GITHUB_SHA and opened on an Android emulator without crashing. $SIGNING"
