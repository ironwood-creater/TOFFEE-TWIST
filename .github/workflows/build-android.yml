# Builds the Android app on GitHub's computers, so you don't need Android Studio.
#
# How to use: on GitHub open the "Actions" tab > "Build Android app" >
# "Run workflow". After about 10-15 minutes, open the finished run and download
# "toffee-twist-android" at the bottom of the page. It contains:
#   app-release.apk  - install this on your phone to play
#   app-release.aab  - upload this to Google Play
#
# Without the secrets below, both files are signed with a debug key. The APK
# still installs on a phone, but Google Play only accepts an .aab signed with
# YOUR upload key. To sign with it, add these in
# Settings > Secrets and variables > Actions > New repository secret:
#   UPLOAD_KEYSTORE_BASE64  - your .jks file as base64
#                             (macOS/Linux: base64 -w0 ~/toffee-twist-upload.jks)
#   UPLOAD_KEYSTORE_PASSWORD - the password you chose for the key
name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Use the upload key (only if the secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No upload key secrets: signing with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=upload.jks
          EOF

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: toffee-twist-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
